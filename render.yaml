# Render Blueprint — one Web Service serving the API + built SPA.
# Create the database on Neon (free serverless Postgres) and paste its pooled
# connection string into DATABASE_URL below (or set it in the Render dashboard).
services:
  - type: web
    name: care-tracker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # NOTE: Render's free plan silently ignores `preDeployCommand`, so migrations are
    # applied at container startup instead (see apps/server/src/index.ts). Run
    # `bun run db:create-admin` once from the Render shell after the first deploy to create the admin.
    # On a paid plan you can move migrations back to a pre-deploy step:
    #   preDeployCommand: bun run db:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Cloudflare R2 for uploaded photos (optional; without it they're kept in Postgres).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Optional overrides (defaults live in apps/server/src/config.ts):
      # - key: ACCESS_TOKEN_TTL
      #   value: 15m
      # - key: REFRESH_TOKEN_TTL_DAYS
      #   value: "30"
